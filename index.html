<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIGOGFLIX ULTRA PREMIUM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#fff;padding-bottom:80px;font-family:sans-serif}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px}
.logo{font-weight:900;font-size:20px;line-height:1}
.icons{display:flex;gap:8px}.icon{width:36px;height:36px;background:#1a1a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero{margin:10px;border-radius:20px;overflow:hidden;position:relative;height:420px;background:#000}
.hero img{width:100%;height:100%;object-fit:cover}
.btn-row{display:flex;gap:10px;margin-top:15px;position:absolute;bottom:20px;left:15px;right:15px;z-index:2}
.btn-row button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.section{padding:15px;display:flex;justify-content:space-between;align-items:center}
.card{border-radius:18px;overflow:hidden;position:relative;height:180px;background:#1a1a2a;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 15px}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999;display:none;flex-direction:column}
#player.show{display:flex}
.p-top{height:70px;background:#000;display:flex;align-items:center;padding:0 15px;gap:10px}
.back{width:36px;height:36px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.video-wrap{flex:1;background:#000;position:relative}
.video-wrap iframe{width:100%;height:100%;border:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:50}
.b-item{display:flex;flex-direction:column;align-items:center;font-size:10px;gap:4px;color:#888;cursor:pointer}
.b-item.active{color:#6cf}
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-weight:700;font-size:13px;z-index:1000;display:none}
</style>
</head>
<body>
<div class="header">
  <div class="logo">GIGOGFLIX<br><span style="font-size:12px;color:#a78bfa">ULTRA PREMIUM</span></div>
  <div class="icons">
    <div class="icon" onclick="showToast('Search dibuka')">🔍</div>
    <div class="icon" onclick="showToast('Notifikasi: 3 baru')">🔔</div>
    <div class="icon" onclick="showToast('Profile Ultra Premium ✓')">👤</div>
  </div>
</div>
<div class="hero" onclick="playFilm()">
  <img src="https://images.unsplash.com/photo-1494783367193-149034c05e8f?q=80&w=800">
  <div class="btn-row">
    <button onclick="event.stopPropagation();playFilm()" style="background:#fff;color:#000">▶ Play</button>
    <button onclick="event.stopPropagation();showToast('Ditambahkan ke My List ✓')" style="background:rgba(255,255,255,.2);color:#fff">+ My List</button>
  </div>
</div>
<div class="section"><h3>Trending Now</h3><span onclick="showToast('Buka semua Trending Now →')" style="color:#6cf;font-size:13px;cursor:pointer">See all ></span></div>
<div class="grid">
  <div class="card" onclick="playFilm()"><img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=400"></div>
  <div class="card" onclick="playFilm()"><img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?q=80&w=400"></div>
  <div class="card" onclick="playFilm()"><img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=400"></div>
  <div class="card" onclick="playFilm()"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400"></div>
  <div class="card" onclick="playFilm()"><img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=400"></div>
</div>
<div id="player"><div class="p-top"><div class="back" onclick="closePlayer()">✕</div><div>Now Playing</div></div><div class="video-wrap"><iframe id="filmFrame" src="" allowfullscreen></iframe></div></div>
<div class="bottom">
  <div class="b-item active" onclick="navClick(this,'Home')">🏠<br>Home</div>
  <div class="b-item" onclick="navClick(this,'Search')">🔍<br>Search</div>
  <div class="b-item" onclick="navClick(this,'Downloads')">⬇️<br>Downloads</div>
  <div class="b-item" onclick="navClick(this,'New & Hot')">🔥<br>New & Hot</div>
  <div class="b-item" onclick="navClick(this,'Profile')">👤<br>Profile</div>
</div>
<div id="toast"></div>
<script>
const filmId='1N2qr230u2XFyHHkKAlumamjoyFqYhWvE9vVvL8XwJzQ';
function playFilm(){document.getElementById('filmFrame').src='https://drive.google.com/file/d/'+filmId+'/preview';document.getElementById('player').classList.add('show');}
function closePlayer(){document.getElementById('player').classList.remove('show');document.getElementById('filmFrame').src='';}
function showToast(t){let x=document.getElementById('toast');x.innerText=t;x.style.display='block';setTimeout(()=>x.style.display='none',2000);}
function navClick(el,name){document.querySelectorAll('.b-item').forEach(b=>b.classList.remove('active'));el.classList.add('active');showToast('Buka '+name);}
</script>
</body>
</html>
