<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIGOGFLIX - Nonton Gratis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
header{padding:15px 4%;display:flex;align-items:center;background:#000;position:sticky;top:0;z-index:10}
.logo{font-family:Impact,Arial Black,sans-serif;font-weight:900;font-size:28px;letter-spacing:1px;cursor:pointer}
.search-box{margin-left:auto}
.search-box input{padding:8px 15px;border-radius:20px;border:none;background:#222;color:#fff;width:200px;outline:none}
.hero{height:70vh;background:linear-gradient(to bottom,rgba(0,0,0,0.3),#000), url('https://image.tmdb.org/t/p/original/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg');background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:4%}
.hero h1{font-size:42px;margin-bottom:10px}
.row{padding:20px 4%}
.row h2{margin-bottom:15px;font-size:20px}
.movies{display:flex;gap:10px;overflow-x:auto}
.movie{min-width:160px;height:240px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}
.movie:hover{transform:scale(1.05);transition:0.3s;background:#333}
</style>
</head>
<body>
<header>
<div class="logo"><span style="color:#ffffff">GIGOG</span><span style="color:#E50914;text-shadow:0 0 10px #E50914">FLIX</span></div>
<div class="search-box"><input id="search" placeholder="Search movies..."></div>
</header>
<div class="hero">
<div><h1>Welcome to GIGOGFLIX</h1><p>Streaming Mantap Mas - Nonton Film Terlengkap Gratis</p></div>
</div>
<div class="row"><h2>Trending Now</h2><div class="movies"><div class="movie">Film 1</div><div class="movie">Film 2</div><div class="movie">Film 3</div><div class="movie">Film 4</div><div class="movie">Film 5</div><div class="movie">Film 6</div></div></div>
<div class="row"><h2>Top 10 Indonesia</h2><div class="movies"><div class="movie">Film 7</div><div class="movie">Film 8</div><div class="movie">Film 9</div><div class="movie">Film 10</div></div></div>
</body>
</html>
