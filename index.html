<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIGOGFLIX</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#060610;padding:8px}body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 10% 10%,#2a1a6e,transparent),radial-gradient(700px 500px at 90% 20%,#6a1a5a,transparent),url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2000');background-size:cover;z-index:-2}body::after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,5,15,.2),rgba(5,5,15,.9));z-index:-1}.app{max-width:1180px;margin:auto;border-radius:20px;background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.13);overflow:hidden}.header{margin:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}.logo{font-weight:900;color:#fff}.nav{display:flex;gap:14px;font-size:12px;color:#aaa}.nav b{color:#fff;border-bottom:2px solid #7af4ff}.search{margin-left:auto}input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;width:220px}.pills{display:flex;gap:8px;padding:12px;overflow:auto}.pill{padding:6px 12px;border-radius:999px;font-size:11px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);color:#ccc;white-space:nowrap}.pill.active{background:#aef2ff;color:#000;font-weight:800}.feat{margin:0 12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;gap:12px}.f-title{font-size:26px;font-weight:900;color:#fff}.movies{display:flex;gap:10px;overflow:auto;padding:12px}.card{min-width:130px;width:130px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);overflow:hidden}.card img{width:100%;height:120px;object-fit:cover}.info{padding:6px;color:#fff}.info h4{font-size:10px}.info p{font-size:8px;color:#aaa}</style></head><body><div class="app"><div class="header"><div class="logo">GIGOGFLIX</div><div class="nav"><b>Home</b><span>Series</span><span>Movies</span><span>My List</span></div><div class="search"><input id="s" placeholder="Search movies... 🔍" oninput="cari()"></div></div><div class="pills"><div class="pill active" onclick="filter('all',this)">Trending</div><div class="pill" onclick="filter('scifi',this)">Sci-Fi</div><div class="pill" onclick="filter('action',this)">Action</div><div class="pill" onclick="filter('drama',this)">Drama</div></div><div class="feat"><div style="flex:1"><div style="font-size:8px;color:#ccc">FEATURED #1</div><div class="f-title">DUNE: EMPIRE</div><div style="font-size:10px;color:#ccc">Now Streaming 4K HDR</div><div style="margin-top:10px"><button onclick="alert('Play Trailer DUNE!')" style="padding:8px 14px;border-radius:8px;border:none;font-weight:800;background:linear-gradient(90deg,#7af4ff,#b794ff)">▶ Play</button><button onclick="alert('Added to My List!')" style="padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff">+ My List</button></div></div><div style="width:260px;border-radius:10px;overflow:hidden"><img src="https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg" style="width:100%;height:120px;object-fit:cover"></div></div><div class="movies" id="list"></div></div><script>
const data=[{t:"NOVA PROTOCOL",y:"2025",r:"4.6★",i:"https://image.tmdb.org/t/p/w300/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg",c:"scifi"},{t:"SHADOW STRIKE",y:"2024",r:"4.7★",i:"https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg",c:"action"},{t:"CYBER RIFT",y:"2025",r:"Now Playing",i:"https://image.tmdb.org/t/p/w300/d5NXSklXo0qyIYkgV94XAgMIckC.jpg",c:"scifi"},{t:"VOID HORIZON",y:"2024",r:"4.5★",i:"https://image.tmdb.org/t/p/w300/qW4crfED8mpNDadSmMdi7ZDzhXF.jpg",c:"drama"},{t:"IRON LEGACY",y:"2025",r:"4.4★",i:"https://image.tmdb.org/t/p/w300/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg",c:"action"}];
function render(d){let h="";d.forEach(m=>{h+=`<div class="card"><img src="${m.i}"><div class="info"><h4>${m.t}</h4><p>${m.y} • ${m.r}</p></div></div>`});document.getElementById('list').innerHTML=h}render(data);
let cat="all";function filter(c,e){cat=c;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));e.classList.add('active');cari()}
function cari(){let q=document.getElementById('s').value.toLowerCase();let f=data.filter(m=>{let a=cat=="all"||m.c==cat;let b=m.t.toLowerCase().includes(q);return a&&b});render(f)}
</script></body></html>
