<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigogFlix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141414;color:#fff;font-family:Arial}
header{position:fixed;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 4%;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
.logo{color:#E50914;font-size:26px;font-weight:900}
.nav{font-size:14px;display:flex;gap:15px}
.search{border:1px solid #666;background:#000;color:#fff;padding:6px 10px;width:120px}
.banner{position:relative;height:85vh;background:#000}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#141414 10%,transparent 60%),linear-gradient(90deg,rgba(0,0,0,.7) 0,transparent 60%)}
.content{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:0 4% 90px;max-width:500px}
.badge{font-size:13px;font-weight:700;margin-bottom:12px}
.title{font-size:36px;font-weight:900;line-height:1.1;margin-bottom:10px}
.desc{font-size:14px;line-height:1.3;color:#ddd;margin-bottom:18px}
.btns{display:flex;gap:10px;position:relative;z-index:5}
.btn{padding:12px 26px;border-radius:4px;font-weight:700;font-size:15px;border:none;cursor:pointer;white-space:nowrap}
.btn-play{background:#fff;color:#000}.btn-list{background:rgba(109,109,110,.8);color:#fff}
.rows{position:relative;z-index:3;margin-top:-50px;padding-bottom:40px;background:#141414}
.row-title{font-size:18px;font-weight:700;margin:20px 0 10px 4%}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 4% 10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{min-width:155px;height:230px;border-radius:4px;overflow:hidden;flex-shrink:0;cursor:pointer;position:relative;background:#222;transition:.3s}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:100%;object-fit:cover}
.card-t{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:30px 8px 8px;font-size:11px;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center;padding:15px}
.modal.on{display:flex}
.box{background:#181818;border-radius:8px;width:100%;max-width:800px;overflow:hidden;position:relative}
.close{position:absolute;top:10px;right:10px;background:#000;color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2}
.video{width:100%;aspect-ratio:16/9;background:#000}
.video iframe{width:100%;height:100%;border:0}
.info{padding:15px}.info h2{font-size:20px}
@media(max-width:600px){.title{font-size:28px}.card{min-width:110px;height:160px}.content{padding-bottom:70px}}
</style>
</head>
<body>
<header><div style="display:flex;gap:20px;align-items:center"><div class="logo">GIGOGFLIX</div><div class="nav"><span>Home</span><span>Movies</span><span>My List</span></div></div><input class="search" placeholder="🔍 Search" oninput="cari(this.value)"></header>
<div class="banner"><img src="https://image.tmdb.org/t/p/original/or06FN3Dka5tukK1e9sl16pB3iy.jpg"><div class="content"><div class="badge">🔴 TOP 10 #1 in Indonesia Today</div><h1 class="title">AVENGERS: ENDGAME</h1><p class="desc">After Infinity War, the Avengers assemble once more to reverse Thanos' actions and restore balance to the universe.</p><div class="btns"><button class="btn btn-play" onclick="play('Avengers: Endgame','TcMBFSGVi1c')">▶ Play</button><button class="btn btn-list" onclick="alert('Added to My List ❤️')">+ My List</button></div></div></div>
<div class="rows" id="rows">
<div><h2 class="row-title">Trending Now</h2><div class="row" id="r1"></div></div>
<div><h2 class="row-title">Top 10 in Indonesia Today</h2><div class="row" id="r2"></div></div>
<div><h2 class="row-title">New Releases</h2><div class="row" id="r3"></div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target.id=='modal')tutup()"><div class="box"><button class="close" onclick="tutup()">✕</button><div class="video"><iframe id="yt" src="" allowfullscreen></iframe></div><div class="info"><h2 id="mt"></h2><p style="color:#999;font-size:13px;margin-top:6px">Official Trailer - GigogFlix</p></div></div></div>
<script>
const f=[
{t:"Ne Zha 2",i:"https://image.tmdb.org/t/p/w500/qW4crfED8mpNDadSmMdi7ZDzhXF.jpg",y:"pT68FSWab1Q"},
{t:"Batman",i:"https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",y:"mqqft2x_Aa4"},
{t:"Oppenheimer",i:"https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7x2nJsG.jpg",y:"uYPbbksJxIg"},
{t:"Spider-Man",i:"https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg",y:"JfVOs4VSpmA"},
{t:"John Wick 4",i:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg",y:"qEVU3r4jCKA"},
{t:"Avatar 2",i:"https://image.tmdb.org/t/p/w500/s5HQf2gb3lIOCoecA1QEj9aemw.jpg",y:"d9MyW72ELq0"},
{t:"Interstellar",i:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",y:"zSWdZVtXT7E"},
{t:"Avengers",i:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",y:"TcMBFSGVi1c"}
];
function buat(id,list){
document.getElementById(id).innerHTML=list.map(x=>`<div class="card" onclick="play('${x.t}','${x.y}')"><img src="${x.i}"><div class="card-t">${x.t}</div></div>`).join('');
}
buat('r1',f);buat('r2',f);buat('r3',[...f].reverse());
function play(t,y){document.getElementById('mt').innerText=t;document.getElementById('yt').src=`https://www.youtube.com/embed/${y}?autoplay=1`;document.getElementById('modal').classList.add('on');}
function tutup(){document.getElementById('modal').classList.remove('on');document.getElementById('yt').src='';}
function cari(q){q=q.toLowerCase();if(!q){buat('r1',f);return;}buat('r1',f.filter(a=>a.t.toLowerCase().includes(q)));}
</script>
</body>
</html>
