*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a12;color:#fff;padding-bottom:80px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#15151f;border-radius:15px;margin:10px}
.logo{font-weight:900;font-size:20px;line-height:18px;background:linear-gradient(90deg,#6cf2ff,#ff8ad8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.icon{width:38px;height:38px;background:#2a2a3a;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hero{margin:10px;border-radius:20px;overflow:hidden;position:relative;height:380px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-top{position:absolute;top:15px;left:15px;font-weight:900;letter-spacing:1px}
.hero-card{position:absolute;bottom:15px;left:10px;right:10px;background:rgba(30,30,40,0.85);backdrop-filter:blur(10px);border-radius:20px;padding:15px}
