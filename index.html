<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigogFlix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141414;color:#fff;font-family:Arial,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:60px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent)}
.logo{color:#E50914;font-size:24px;font-weight:900}
.nav{display:flex;gap:15px;font-size:13px}
.banner{height:85vh;background:url('https://images.unsplash.com/photo-1626379616459-b2ce1d9decbc?w=1200') center/cover;display:flex;align-items:flex-end;position:relative}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#141414 0,transparent 60%),linear-gradient(77deg,rgba(0,0,0,.6) 0,transparent 80%)}
.banner-box{position:relative;z-index:2;padding:20px 60px 100px;max-width:600px}
.banner-box h1{font-size:38px;font-weight:900;margin-bottom:10px}
.banner-box p{font-size:16px;opacity:.9;margin-bottom:15px}
.btns{display:flex;gap:10px}
.btn{padding:8px 22px;border-radius:4px;font-weight:700;border:none;cursor:pointer}
.btn-play{background:#fff;color:#000}
.btn-list{background:rgba(109,109,110,.7);color:#fff}
.row-title{font-size:18px;margin:20px 0 10px 60px}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px 60px}
.row::-webkit-scrollbar{display:none}
.card{min-width:250px;height:140px;border-radius:4px;overflow:hidden;background:#333;flex-shrink:0}
.card img{width:100%;height:100%;object-fit:cover}
.top-row{display:flex;align-items:center;gap:5px}
.top-num{font-size:120px;font-weight:900;color:#000;-webkit-text-stroke:2px #555;margin-right:-20px}
@media(max-width:600px){.banner-box{padding:20px 15px 60px}.banner-box h1{font-size:26px}.row-title{margin-left:15px}.row{padding-left:15px}.card{min-width:160px;height:90px}}
</style>
</head>
<body>
<header><div class="logo">GIGOGFLIX</div><div class="nav"><span>Home</span><span>TV Shows</span><span>Movies</span></div></header>
<div class="banner"><div class="banner-box"><h1>AVENGERS: ENDGAME</h1><p>After Thanos, the Avengers assemble once more to restore balance to the universe.</p><div class="btns"><button class="btn btn-play">▶ Play</button><button class="btn btn-list">+ My List</button></div></div></div>
<h2 class="row-title">Trending Now</h2><div class="row" id="r1"></div>
<h2 class="row-title">Top 10 in Indonesia Today</h2><div class="row" id="r2"></div>
<h2 class="row-title">New Releases</h2><div class="row" id="r3"></div>
<script>
const m=["https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400","https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400","https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400","https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=400","https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400","https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=400"];
function addRow(id,top){
let r=document.getElementById(id);
m.forEach((img,i)=>{let d=document.createElement('div');if(top){d.className='top-row';d.innerHTML=`<div class="top-num">${i+1}</div><div class="card"><img src="${img}"></div>`}else{d.className='card';d.innerHTML=`<img src="${img}">`}r.appendChild(d)})
}
addRow('r1',false);addRow('r2',true);addRow('r3',false);
</script>
</body>
  </html>
