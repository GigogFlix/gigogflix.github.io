body{background:#07071a;padding:12px}

body::after{content:"";position:fixed;inset:0;background:rgba(8,5,28,.82);z-index:-1}

.logo{font-weight:900;font-size:18px;background:linear-gradient(90deg,#7af4ff,#b794ff,#ff8ecf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;gap:14px;color:#888;font-size:12px;font-weight:600}
.nav .on{color:#fff;border-bottom:2px solid #7af4ff}
.search{margin-left:auto}
.search input{padding:9px 12px 9px 32px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;width:190px}
.pills{display:flex;gap:8px;padding:14px 18px;overflow:auto}
.pill{padding:8px 13px;border-radius:999px;font-size:11px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#aaa}
.pill.on{background:linear-gradient(90deg,#c8f7ff,#ffc2e0);color:#000;font-weight:800}
.hero{margin:0 14px;padding:16px;border-radius:22px;background:linear-gradient(100deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.22);display:flex;gap:16px}
.hero h1{font-size:32px;color:#fff;font-weight:900}
.movies{display:flex;gap:12px;overflow:auto;padding:16px}
.card{min-width:155px;width:155px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.card.glow{border-color:#7af4ff;box-shadow:0 0 25px rgba(122,244,255,.5)}
.card img{width:100%;height:145px;object-fit:cover}
.info{padding:9px;color:#fff}
</style>
