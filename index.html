<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GIGOGFLIX ULTRA PREMIUM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{background:#050510;color:#fff;min-height:100vh;padding-bottom:100px;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at top,#1a1a3a 0%,#050510 60%);z-index:-1}
.phone{max-width:430px;margin:0 auto;position:relative;padding:10px}
.glass{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.15)}

/* HEADER */
.header{border-radius:22px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo-text{font-weight:900;font-size:24px;background:linear-gradient(90deg,#f5d76e,#a67c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.badge-ultra{border:1px solid #c9a84c;color:#e8c97a;font-size:10px;padding:4px 10px;border-radius:20px;margin-left:8px;letter-spacing:1px}
.h-icons{display:flex;gap:10px}
.h-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* HERO */
.hero{border-radius:24px;overflow:hidden;position:relative;height:520px;background:#000}
.hero-bg{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 10%,rgba(0,0,0,0.9) 100%)}
.top-badge{position:absolute;top:16px;right:16px;z-index:3;background:rgba(201,168,76,0.15);border:1px solid #c9a84c;color:#f5d76e;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:20px;z-index:3}
.hero-card{border-radius:20px;padding:18px}
.hero-card h1{font-size:32px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#f5d76e,#fff2c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.meta{font-size:12px;color:#ccc;margin-bottom:10px}
.desc{font-size:13px;color:#aaa;line-height:1.5;margin-bottom:18px}
.btn-row{display:flex;gap:12px}
.btn-play{flex:1.2;background:linear-gradient(135deg,#f5d76e,#c9a84c);color:#000;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 0 20px rgba(245,215,110,0.4)}
.btn-list{flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(201,168,76,0.5);color:#fff;padding:14px;border-radius:14px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}

/* TRENDING */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:24px 6px 14px}
.sec-head h3{font-size:22px;font-weight:700}
.sec-head span{color:#f5d76e;font-size:13px;cursor:pointer}
.trend{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.trend::-webkit-scrollbar{display:none}
.t-card{min-width:115px;width:115px;height:200px;border-radius:14px;overflow:hidden;position:relative;background:#111;border:1px solid rgba(255,255,255,0.1);cursor:pointer;flex-shrink:0}
.t-card img{width:100%;height:100%;object-fit:cover}
.t-card.active{border:1px solid #f5d76e;box-shadow:0 0 15px rgba(245,215,110,0.5)}
.t-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.95));padding:30px 8px 8px}
.t-info b{display:block;font-size:13px;line-height:1.1}
.t-info small{font-size:9px;color:#aaa}
