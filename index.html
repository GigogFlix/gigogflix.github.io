<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIGOGFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
#hdr{display:flex;flex-direction:column;gap:10px;padding:12px 15px;background:#000;position:fixed;top:0;left:0;right:0;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:center}
.logo{color:#e50914;font-weight:900;font-size:22px}
.menu{display:flex;gap:10px;font-size:12px;color:#aaa}
.menu span{cursor:pointer}
.avatar{background:#e50914;width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center}
#searchBox{width:100%;padding:11px;background:#222;border:1px solid #333;border-radius:8px;color:#fff}
.banner{height:60vh;min-height:400px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:20px;margin-top:105px}
#rows{padding:15px}
.cards{display:flex;gap:10px;overflow-x:auto}
.card{min-width:130px;height:190px;background:#222;border-radius:6px;overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<header id="hdr">
<div class="hdr-top">
<div style="display:flex;gap:12px;align-items:center">
<div class="logo">GIGOGFLIX</div>
<div class="menu"><span onclick="location.reload()">Home</span><span>TV Shows</span><span>Movies</span><span>My List</span></div>
</div>
<div class="avatar">G</div>
</div>
<input id="searchBox" placeholder="🔍 Titles" oninput="doSearch(this.value)">
</header>
<div class="banner" id="banner" style="background-image:url(https://img.youtube.com/vi/qEVU3r4jCKA/maxresdefault.jpg)"><h1>John Wick 4</h1></div>
<div id="rows"><div class="cards" id="cards"></div></div>
<script>
const films=[{t:"John Wick 4",y:"qEVU3r4jCKA"},{t:"Avengers",y:"TcMBFSGVi1c"},{t:"The Batman",y:"mqqft2x_Aa4"}];
function render(q=""){const c=document.getElementById('cards');c.innerHTML=films.filter(f=>f.t.toLowerCase().includes(q.toLowerCase())).map(f=>`<div class="card"><img src="https://img.youtube.com/vi/${f.y}/mqdefault.jpg"><div style="position:absolute;bottom:0;background:linear-gradient(transparent,black);width:100%;padding:6px;font-size:11px">${f.t}</div></div>`).join('')}
function doSearch(v){render(v)}
render();
</script>
</body>
</html>
