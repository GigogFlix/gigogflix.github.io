<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigogFlix - Nonton Gratis</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:20px}
h1{color:#e50914;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;max-width:1000px;margin:20px auto}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card .title{padding:10px;font-size:14px;font-weight:bold;text-align:center}
.player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center;flex-direction:column}
.player iframe{width:90%;max-width:800px;height:450px;border:none;border-radius:10px}
.close{margin-top:15px;background:#e50914;color:#fff;border:none;padding:10px 25px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<h1>🔥 GIGOGFLIX 🔥</h1>

<div class="grid">

<!-- FILM BARU MAS - ID GOOGLE DRIVE MAS SUDAH MASUK -->
<div class="card" onclick="playFilm('1N2qr230u2XFyHHkKAlumamjoyFMLLtdm')">
<img src="film-agent-kim-reactivated-2026-lk21.jpg.webp" alt="Film">
<div class="title">Film Baru Drive</div>
</div>

</div>

<div class="player" id="player">
<iframe id="filmFrame" src="" allowfullscreen></iframe>
<button class="close" onclick="closeFilm()">Tutup Film</button>
</div>

<script>
function playFilm(id){
  document.getElementById('filmFrame').src="https://drive.google.com/file/d/"+id+"/preview";
  document.getElementById('player').style.display='flex';
}
function closeFilm(){
  document.getElementById('filmFrame').src="";
  document.getElementById('player').style.display='none';
}
</script>
</body>
  </html>
